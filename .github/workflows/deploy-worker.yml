name: Deploy JARVIS Worker to Cloudflare

on:
  push:
    branches:
      - feature/cloudflare-worker
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. This is a Cloudflare deployment token, not JARVIS_API_TOKEN."
            exit 1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify deployed Worker and runtime
        run: |
          node --input-type=module <<'NODE'
          const base = "https://jarvis-iron-paradise.antoine-delage2001.workers.dev";
          let health;
          for (let attempt = 0; attempt < 8; attempt++) {
            const response = await fetch(base + "/health", { cache: "no-store" });
            if (response.ok) health = await response.json();
            if (health?.deployment === "avengers-nine-agents-one-request-v3") break;
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!health || health.deployment !== "avengers-nine-agents-one-request-v3") throw new Error("Cloudflare did not serve the new Worker version.");
          if (!health.tokenConfigured || health.ai !== "connected" || health.agents !== 9) throw new Error("Worker deployed, but runtime token, AI binding or nine-agent configuration is incomplete.");
          const agentsResponse = await fetch(base + "/agents", { cache: "no-store" });
          const agents = await agentsResponse.json();
          if (!Array.isArray(agents.agents) || agents.agents.length !== 9) throw new Error("Agent directory check failed.");
          console.log("JARVIS_DEPLOYED_AND_READY=YES");
          NODE
