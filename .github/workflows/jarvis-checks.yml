name: JARVIS quality checks

on:
  push:
    branches: [main, feature/cloudflare-worker]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app action console
        if: hashFiles('jarvis-actions.js') != ''
        run: node --check jarvis-actions.js
      - name: Check inline application JavaScript
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("index.html", "utf8");
          const chunks = html.split("<script").slice(1);
          let count = 0;
          for (const chunk of chunks) {
            const openEnd = chunk.indexOf(">");
            const close = chunk.indexOf("</script>");
            if (openEnd < 0 || close < 0) continue;
            const attrs = chunk.slice(0, openEnd);
            if (attrs.includes("src=") || attrs.includes('type="module"') || attrs.includes("type='module'")) continue;
            fs.writeFileSync("/tmp/jarvis-inline-" + count++ + ".js", chunk.slice(openEnd + 1, close));
          }
          if (!count) throw new Error("No inline application script found");
          NODE
          for file in /tmp/jarvis-inline-*.js; do node --check "$file"; done
      - name: Check Cloudflare Worker syntax
        if: hashFiles('worker/src/index.js') != ''
        run: node --input-type=module --check < worker/src/index.js
      - name: Verify integration points
        run: |
          if [ -f worker/src/index.js ]; then grep -q 'url.pathname === "/act"' worker/src/index.js; fi
          if grep -q './jarvis-actions.js' index.html; then test -f jarvis-actions.js; fi
