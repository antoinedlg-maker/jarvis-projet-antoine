name: JARVIS quality checks

on:
  push:
    branches: [main, feature/cloudflare-worker]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app action console
        if: hashFiles('jarvis-actions.js') != ''
        run: node --check jarvis-actions.js
      - name: Check Cloudflare Worker syntax
        if: hashFiles('worker/src/index.js') != ''
        run: node --input-type=module --check < worker/src/index.js
      - name: Verify integration points
        run: |
          if [ -f worker/src/index.js ]; then grep -q 'url.pathname === "/act"' worker/src/index.js; fi
          if [ -f jarvis-actions.js ]; then grep -q './jarvis-actions.js' index.html; fi

  live-worker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Worker deployment and token binding
        run: |
          node --input-type=module <<'NODE'
          const base = "https://jarvis-iron-paradise.antoine-delage2001.workers.dev";
          const response = await fetch(base + "/health", { cache: "no-store" });
          if (!response.ok) throw new Error("Worker health HTTP " + response.status);
          const health = await response.json();
          console.log(JSON.stringify({
            status: health.status,
            ai: health.ai,
            agents: health.agents,
            tokenConfigured: health.tokenConfigured,
            tokenBindingNames: health.tokenBindingNames,
            deployment: health.deployment
          }));
          if (health.deployment !== "token-diagnostic-v1") throw new Error("Cloudflare is still serving an older Worker deployment");
          if (!health.tokenConfigured) throw new Error("Cloudflare runtime does not expose JARVIS_API_TOKEN");
          if (health.ai !== "connected" || health.agents !== 4) throw new Error("Worker AI or agent configuration is incomplete");
          NODE
