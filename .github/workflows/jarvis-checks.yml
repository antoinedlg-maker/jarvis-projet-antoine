name: JARVIS quality checks

on:
  push:
    branches: [main, feature/cloudflare-worker]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app action console
        if: hashFiles('jarvis-actions.js') != ''
        run: node --check jarvis-actions.js
      - name: Check Cloudflare Worker syntax
        if: hashFiles('worker/src/index.js') != ''
        run: node --input-type=module --check < worker/src/index.js
      - name: Verify integration points
        run: |
          if [ -f worker/src/index.js ]; then grep -q 'url.pathname === "/act"' worker/src/index.js; fi
          if [ -f jarvis-actions.js ]; then grep -q './jarvis-actions.js' index.html; fi

  live-worker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Worker version
        id: version
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch("https://jarvis-iron-paradise.antoine-delage2001.workers.dev/health", { cache: "no-store" });
          if (!response.ok) throw new Error("Worker health HTTP " + response.status);
          const health = await response.json();
          console.log("DEPLOYMENT=" + health.deployment);
          console.log("TOKEN_BINDINGS=" + (health.tokenBindingNames || []).join(","));
          if (health.deployment !== "avengers-seven-agents-v1") throw new Error("Cloudflare is serving an older deployment; the configured Git integration is not publishing this branch.");
          NODE
      - name: Verify token is visible in runtime
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch("https://jarvis-iron-paradise.antoine-delage2001.workers.dev/health", { cache: "no-store" });
          const health = await response.json();
          if (!health.tokenConfigured) throw new Error("The live Worker deployment is current, but its runtime does not expose JARVIS_API_TOKEN. Check the secret on this exact Worker/environment.");
          if (health.ai !== "connected" || health.agents !== 7) throw new Error("Worker AI or agent configuration is incomplete.");
          console.log("JARVIS_WORKER_READY: seven agents, AI and token binding detected.");
          NODE
