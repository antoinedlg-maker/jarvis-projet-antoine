[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "openjarvis"
version = "0.1.0"
description = "Python core for JARVIS, based on OpenJarvis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "click>=8.0",
  "croniter>=2.0",
  "filelock>=3.13",
  "httpx>=0.27",
  "openai>=1.30",
  "psutil>=5.9",
  "requests>=2.31",
  "rich>=13.0",
  "tomlkit>=0.12",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.4"]
server = ["fastapi>=0.110", "uvicorn>=0.30", "pydantic>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/openjarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
